name: Sync bank emails

# Background ingestion so transactions log themselves even when the app is
# closed. Hits the existing /api/cron/sync endpoint (protected by CRON_SECRET).
# Every 30 min keeps us well within GitHub's free 2,000 Actions-min/month on a
# private repo (~1,460 min/month). The app also syncs on open, so this is just
# the "while you're not looking" backstop.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC; GitHub may delay under load)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger paisa sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          code=$(curl -sS -o /tmp/sync-out.txt -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://paisa-tawny.vercel.app/api/cron/sync")
          echo "HTTP $code"
          cat /tmp/sync-out.txt || true
          echo
          # Name the actual cause per status — the old catch-all blamed
          # CRON_SECRET for every failure, which sent us hunting the wrong bug
          # when the real problem was the function timing out.
          case "$code" in
            200) ;;
            401) echo "::error::HTTP 401 — CRON_SECRET here does not match the one in Vercel."; exit 1 ;;
            503) echo "::error::HTTP 503 — CRON_SECRET is not set in the Vercel project env."; exit 1 ;;
            504) echo "::error::HTTP 504 — the sync function exceeded its time limit. It should now stop cleanly within its budget; if this persists the per-tick work needs trimming."; exit 1 ;;
            500) echo "::error::HTTP 500 — the sync threw. See the response body above and the Vercel function logs."; exit 1 ;;
            *)   echo "::error::Sync returned HTTP $code. See the response body above."; exit 1 ;;
          esac
